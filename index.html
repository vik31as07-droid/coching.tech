<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MADE EASY Jaipur</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  font-family: Arial, sans-serif;
  color: #222;
  line-height: 1.6;
}

:root {
  --primary: #12335b;
  --secondary: #ed9b20;
  --light: #f3f6fa;
}

.container {
  width: 90%;
  max-width: 1200px;
  margin: auto;
}

.topbar {
  background: var(--primary);
  color: white;
  padding: 8px 0;
  font-size: 14px;
}

.topbar .container {
  display: flex;
  justify-content: space-between;
  gap: 10px;
}

header {
  background: white;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 3px 12px #00000012;
}

.navbar {
  min-height: 75px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: relative;
}

.logo {
  font-size: 27px;
  font-weight: bold;
  color: var(--primary);
  text-decoration: none;
}

.logo span {
  color: var(--secondary);
}

.nav-links {
  display: flex;
  align-items: center;
  gap: 25px;
  list-style: none;
}

.nav-links a {
  color: var(--primary);
  text-decoration: none;
  font-weight: bold;
  font-size: 14px;
}

.nav-links a:hover,
.nav-links a.active {
  color: var(--secondary);
}

.menu-btn {
  display: none;
  background: var(--primary);
  color: white;
  border: none;
  padding: 9px 13px;
  border-radius: 5px;
  cursor: pointer;
}
